<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Museu do Universo</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #08090d;
    font-family: Georgia, serif;
}

#interface {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    padding: 18px 22px;
    color: white;
    background: rgba(0,0,0,.75);
    border: 1px solid #c9a86a;
    border-radius: 12px;
    backdrop-filter: blur(8px);
}

#interface h1 {
    margin: 0 0 8px;
    font-size: 21px;
}

#interface p {
    margin: 4px 0;
    font-family: Arial;
    font-size: 13px;
    color: #ddd;
}

#mira {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    color: white;
    font-family: Arial;
    font-size: 24px;
    pointer-events: none;
}

#mensagem {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    padding: 10px 20px;
    background: rgba(0,0,0,.7);
    color: white;
    border-radius: 20px;
    font-family: Arial;
}


/* =========================
   EXPOSIÇÃO
========================= */

#exposicao {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;

    background:
        radial-gradient(
            circle at center,
            #303442,
            #0b0d12 60%,
            #030405
        );
}

#fechar {
    position: absolute;
    top: 25px;
    right: 30px;
    z-index: 200;

    width: 48px;
    height: 48px;

    border-radius: 50%;
    border: 1px solid #c9a86a;

    background: rgba(0,0,0,.7);
    color: white;

    font-size: 28px;
    cursor: pointer;
}

#viewer {
    position: absolute;
    inset: 0;
}

#card {
    position: absolute;

    left: 40px;
    bottom: 40px;

    z-index: 150;

    width: 380px;
    padding: 25px;

    color: white;

    background: rgba(10,10,12,.9);

    border: 1px solid #c9a86a;
    border-radius: 15px;

    backdrop-filter: blur(10px);
}

#card h2 {
    margin: 0 0 5px;

    color: #e2c27a;

    font-size: 27px;
}

#card .periodo {
    color: #999;

    font-family: Arial;
    font-size: 13px;

    margin-bottom: 15px;
}

#card p {
    font-family: Arial;
    line-height: 1.5;
    color: #ddd;
}

#card .dica {
    margin-top: 18px;
    padding-top: 12px;

    border-top: 1px solid #444;

    color: #aaa;
    font-size: 12px;
}

</style>


<script type="importmap">
{
    "imports": {
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

</head>


<body>


<div id="interface">

    <h1>🏛️ Museu do Universo</h1>

    <p>W A S D — andar</p>
    <p>Mouse — olhar</p>
    <p>Clique — examinar objeto</p>

</div>


<div id="mira">+</div>


<div id="mensagem">
    Olhe para uma peça e clique para examiná-la
</div>


<!-- =========================
     EXPOSIÇÃO
========================= -->

<div id="exposicao">

    <button id="fechar">×</button>

    <div id="viewer"></div>

    <div id="card">

        <h2 id="tituloObjeto">
            Objeto
        </h2>

        <div
            class="periodo"
            id="periodoObjeto">

            História

        </div>

        <p id="descricaoObjeto">
            Descrição
        </p>

        <div class="dica">

            🖱️ Arraste para girar<br>
            🔍 Scroll para aproximar

        </div>

    </div>

</div>


<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


/* ==================================================
   TEXTURAS
================================================== */

const textureLoader =
    new THREE.TextureLoader();


const texturaMadeira =
    textureLoader.load(
        "texturas/madeira.jpeg"
    );


const texturaParede =
    textureLoader.load(
        "texturas/parede.jpeg"
    );


const texturaTeto =
    textureLoader.load(
        "texturas/teto.jpeg"
    );


texturaMadeira.wrapS =
    THREE.RepeatWrapping;

texturaMadeira.wrapT =
    THREE.RepeatWrapping;

texturaMadeira.repeat.set(
    8,
    8
);


texturaParede.wrapS =
    THREE.RepeatWrapping;

texturaParede.wrapT =
    THREE.RepeatWrapping;

texturaParede.repeat.set(
    5,
    3
);


texturaTeto.wrapS =
    THREE.RepeatWrapping;

texturaTeto.wrapT =
    THREE.RepeatWrapping;

texturaTeto.repeat.set(
    5,
    5
);


/* ==================================================
   CENA
================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x111218
    );


/* ==================================================
   CÂMERA
================================================== */

const camera =
    new THREE.PerspectiveCamera(

        75,

        window.innerWidth /
        window.innerHeight,

        0.1,

        100

    );


camera.position.set(
    0,
    1.7,
    8
);


/* ==================================================
   RENDER
================================================== */

const renderer =
    new THREE.WebGLRenderer({

        antialias: true

    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.shadowMap.enabled =
    true;


document.body.appendChild(
    renderer.domElement
);


/* ==================================================
   ILUMINAÇÃO
================================================== */

scene.add(

    new THREE.AmbientLight(
        0xffffff,
        0.65
    )

);


const luz =
    new THREE.PointLight(
        0xffd9a0,
        120,
        45
    );


luz.position.set(
    0,
    7,
    0
);


luz.castShadow =
    true;


scene.add(luz);


/* ==================================================
   CHÃO
================================================== */

const chao =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            28,
            28
        ),

        new THREE.MeshStandardMaterial({

            map:
                texturaMadeira,

            roughness:
                0.75

        })

    );


chao.rotation.x =
    -Math.PI / 2;


chao.receiveShadow =
    true;


scene.add(chao);


/* ==================================================
   PAREDES
================================================== */

function criarParede(
    x,
    y,
    z,
    largura,
    altura,
    profundidade
) {

    const parede =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                largura,
                altura,
                profundidade

            ),

            new THREE.MeshStandardMaterial({

                map:
                    texturaParede,

                roughness:
                    0.85

            })

        );


    parede.position.set(
        x,
        y,
        z
    );


    parede.receiveShadow =
        true;


    scene.add(parede);

}


criarParede(
    -14,
    4,
    0,
    0.5,
    8,
    28
);


criarParede(
    14,
    4,
    0,
    0.5,
    8,
    28
);


criarParede(
    0,
    4,
    14,
    28,
    8,
    0.5
);


criarParede(
    0,
    4,
    -14,
    28,
    8,
    0.5
);


/* ==================================================
   TETO
================================================== */

const teto =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            28,
            28
        ),

        new THREE.MeshStandardMaterial({

            map:
                texturaTeto,

            roughness:
                0.9,

            side:
                THREE.DoubleSide

        })

    );


teto.rotation.x =
    Math.PI / 2;


teto.position.y =
    8;


scene.add(teto);


/* ==================================================
   FUNDO VISUAL
================================================== */

const fundoVisual =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            26,
            12
        ),

        new THREE.MeshStandardMaterial({

            map:
                texturaParede,

            roughness:
                0.85

        })

    );


fundoVisual.position.set(
    0,
    4,
    -13.65
);


scene.add(
    fundoVisual
);


/* ==================================================
   MODELOS
================================================== */

const objetos = [];

const gltfLoader =
    new GLTFLoader();


/* ==================================================
   POSIÇÕES
================================================== */

const posicoes = [

    {
        x: -6,
        z: -6
    },

    {
        x: 6,
        z: -6
    },

    {
        x: -6,
        z: 4
    },

    {
        x: 6,
        z: 4
    }

];


/* ==================================================
   CARREGAR PEDESTAL
================================================== */

function carregarPedestal(
    x,
    z
) {

    gltfLoader.load(

        "modelos.glb/pedestal.glb",

        function(gltf) {

            const pedestal =
                gltf.scene;


            /*
             * O pedestal fica apoiado
             * diretamente no chão.
             */

            pedestal.position.set(
                x,
                0,
                z
            );


            /*
             * Ajuste do tamanho do pedestal.
             * Se o seu modelo já estiver no
             * tamanho correto, pode deixar 1.
             */

            pedestal.scale.set(
                1,
                1,
                1
            );


            pedestal.traverse(
                function(obj) {

                    if (
                        obj.isMesh
                    ) {

                        obj.castShadow =
                            true;

                        obj.receiveShadow =
                            true;

                    }

                }
            );


            scene.add(
                pedestal
            );

        },

        undefined,

        function(error) {

            console.error(
                "Erro ao carregar pedestal.glb:",
                error
            );

        }

    );

}


/* ==================================================
   OS 4 PEDESTAIS
================================================== */

for (
    const posicao
    of posicoes
) {

    carregarPedestal(
        posicao.x,
        posicao.z
    );

}


/* ==================================================
   CARREGAR OBJETO
================================================== */

function carregarObjeto(

    arquivo,

    x,
    z,

    escala,

    altura,

    titulo,

    periodo,

    descricao

) {

    gltfLoader.load(

        arquivo,

        function(gltf) {

            const modelo =
                gltf.scene;


            /*
             * Altura do objeto.
             *
             * O objeto fica acima
             * do pedestal.
             */

            modelo.position.set(

                x,

                altura,

                z

            );


            modelo.scale.set(

                escala,
                escala,
                escala

            );


            modelo.traverse(

                function(obj) {

                    if (
                        obj.isMesh
                    ) {

                        obj.castShadow =
                            true;

                        obj.receiveShadow =
                            true;

                    }

                }

            );


            modelo.userData = {

                titulo:
                    titulo,

                periodo:
                    periodo,

                descricao:
                    descricao

            };


            scene.add(
                modelo
            );


            objetos.push(
                modelo
            );

        },

        undefined,

        function(error) {

            console.error(
                "Erro ao carregar:",
                arquivo,
                error
            );

        }

    );

}


/* ==================================================
   1 — TELESCÓPIO
================================================== */

carregarObjeto(

    "modelos.glb/telescopio.glb",

    -6,
    -6,

    0.8,

    2.25,

    "🔭 Telescópio de Galileu",

    "Século XVII",

    "O telescópio de Galileu permitiu observar o céu com muito mais detalhes. Suas observações ajudaram a questionar a ideia de que a Terra era o centro do Universo."

);


/* ==================================================
   2 — ASTROLÁBIO
================================================== */

carregarObjeto(

    "modelos.glb/astrolabio.glb",

    6,
    -6,

    0.8,

    2.25,

    "🌍 Astrolábio",

    "Instrumento astronômico histórico",

    "O astrolábio era utilizado para observar a posição dos astros e auxiliar na navegação e na astronomia. Ele representa a tentativa humana de compreender e organizar o Universo."

);


/* ==================================================
   3 — HOMEM VITRUVIANO
================================================== */

carregarObjeto(

    "modelos.glb/homemvirtruviano.glb",

    -6,
    4,

    0.8,

    2.25,

    "🖼️ Homem Vitruviano",

    "Leonardo da Vinci — Renascimento",

    "O Homem Vitruviano representa o ser humano como referência para compreender proporções, espaço e natureza. A obra é um símbolo do pensamento renascentista."

);


/* ==================================================
   4 — MECANISMO DE ANTICITERA
================================================== */

carregarObjeto(

    "modelos.glb/mecanismo.glb",

    6,
    4,

    0.8,

    2.25,

    "⚙️ Mecanismo de Anticítera",

    "Grécia Antiga — aproximadamente 100 a.C.",

    "O Mecanismo de Anticítera é um antigo dispositivo mecânico utilizado para representar e calcular movimentos astronômicos. Ele demonstra como os seres humanos já buscavam compreender e prever os ciclos do céu há mais de dois mil anos."

);


/* ==================================================
   MOVIMENTO
================================================== */

const teclas = {

    w: false,
    a: false,
    s: false,
    d: false

};


document.addEventListener(

    "keydown",

    function(e) {

        const tecla =
            e.key.toLowerCase();


        if (
            tecla in teclas
        ) {

            teclas[tecla] =
                true;

        }

    }

);


document.addEventListener(

    "keyup",

    function(e) {

        const tecla =
            e.key.toLowerCase();


        if (
            tecla in teclas
        ) {

            teclas[tecla] =
                false;

        }

    }

);


/* ==================================================
   MOUSE
================================================== */

let mousePreso =
    false;

let rotacaoX =
    0;

let rotacaoY =
    0;


renderer.domElement.addEventListener(

    "click",

    function() {

        if (
            !mousePreso
        ) {

            renderer.domElement
                .requestPointerLock();

            return;

        }


        verificarObjeto();

    }

);


document.addEventListener(

    "pointerlockchange",

    function() {

        mousePreso =
            document.pointerLockElement ===
            renderer.domElement;

    }

);


document.addEventListener(

    "mousemove",

    function(e) {

        if (
            !mousePreso
        )
            return;


        rotacaoY -=
            e.movementX * 0.002;


        rotacaoX -=
            e.movementY * 0.002;


        rotacaoX =
            THREE.MathUtils.clamp(

                rotacaoX,

                -Math.PI / 2,
                Math.PI / 2

            );

    }

);


/* ==================================================
   RAYCASTER
================================================== */

const raycaster =
    new THREE.Raycaster();


function verificarObjeto() {

    raycaster.setFromCamera(

        new THREE.Vector2(
            0,
            0
        ),

        camera

    );


    const resultado =
        raycaster.intersectObjects(

            objetos,

            true

        );


    if (
        resultado.length === 0
    )
        return;


    let objeto =
        resultado[0].object;


    while (

        objeto.parent &&
        !objeto.userData.titulo

    ) {

        objeto =
            objeto.parent;

    }


    if (
        objeto.userData.titulo
    ) {

        abrirExposicao(
            objeto
        );

    }

}


/* ==================================================
   MOVIMENTO DO JOGADOR
================================================== */

function mover() {

    const velocidade =
        0.08;


    const frente =
        new THREE.Vector3();


    camera.getWorldDirection(
        frente
    );


    frente.y =
        0;


    frente.normalize();


    const direita =
        new THREE.Vector3(

            -frente.z,
            0,
            frente.x

        );


    const movimento =
        new THREE.Vector3();


    if (teclas.w)
        movimento.add(frente);


    if (teclas.s)
        movimento.sub(frente);


    if (teclas.a)
        movimento.sub(direita);


    if (teclas.d)
        movimento.add(direita);


    if (
        movimento.length() > 0
    ) {

        movimento.normalize();


        movimento.multiplyScalar(
            velocidade
        );


        camera.position.x =
            THREE.MathUtils.clamp(

                camera.position.x +
                movimento.x,

                -12,
                12

            );


        camera.position.z =
            THREE.MathUtils.clamp(

                camera.position.z +
                movimento.z,

                -12,
                12

            );

    }


    camera.position.y =
        1.7;

}


/* ==================================================
   CÂMERA
================================================== */

function atualizarCamera() {

    camera.rotation.order =
        "YXZ";


    camera.rotation.y =
        rotacaoY;


    camera.rotation.x =
        rotacaoX;

}


/* ==================================================
   VISUALIZADOR
================================================== */

const viewerScene =
    new THREE.Scene();


const viewerCamera =
    new THREE.PerspectiveCamera(

        45,

        window.innerWidth /
        window.innerHeight,

        0.1,
        100

    );


viewerCamera.position.set(
    0,
    0,
    5
);


const viewerRenderer =
    new THREE.WebGLRenderer({

        antialias:
            true,

        alpha:
            true

    });


viewerRenderer.setSize(

    window.innerWidth,
    window.innerHeight

);


document.getElementById(
    "viewer"
).appendChild(
    viewerRenderer.domElement
);


const controlesObjeto =
    new OrbitControls(

        viewerCamera,

        viewerRenderer.domElement

    );


controlesObjeto.enableDamping =
    true;


controlesObjeto.enablePan =
    false;


controlesObjeto.minDistance =
    2;


controlesObjeto.maxDistance =
    8;


/* ==================================================
   ABRIR EXPOSIÇÃO
================================================== */

function abrirExposicao(
    objeto
) {

    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();

    }


    document.getElementById(
        "tituloObjeto"
    ).textContent =
        objeto.userData.titulo;


    document.getElementById(
        "periodoObjeto"
    ).textContent =
        objeto.userData.periodo;


    document.getElementById(
        "descricaoObjeto"
    ).textContent =
        objeto.userData.descricao;


    while (
        viewerScene.children.length
    ) {

        viewerScene.remove(
            viewerScene.children[0]
        );

    }


    viewerScene.add(

        new THREE.AmbientLight(
            0xffffff,
            1
        )

    );


    const luzObjeto =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );


    luzObjeto.position.set(
        3,
        5,
        5
    );


    viewerScene.add(
        luzObjeto
    );


    /*
     * Clone do modelo para
     * a tela de exposição.
     */

    const copia =
        objeto.clone(true);


    copia.position.set(
        0,
        0,
        0
    );


    copia.scale.set(
        2,
        2,
        2
    );


    viewerScene.add(
        copia
    );


    controlesObjeto.reset();


    document.getElementById(
        "exposicao"
    ).style.display =
        "block";

}


/* ==================================================
   FECHAR EXPOSIÇÃO
================================================== */

document.getElementById(
    "fechar"
).addEventListener(

    "click",

    function() {

        document.getElementById(
            "exposicao"
        ).style.display =
            "none";

    }

);


/* ==================================================
   ANIMAÇÃO
================================================== */

function animar() {

    requestAnimationFrame(
        animar
    );


    mover();


    atualizarCamera();


    renderer.render(
        scene,
        camera
    );


    controlesObjeto.update();


    viewerRenderer.render(
        viewerScene,
        viewerCamera
    );

}


animar();


/* ==================================================
   RESPONSIVIDADE
================================================== */

window.addEventListener(

    "resize",

    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );


        viewerCamera.aspect =
            window.innerWidth /
            window.innerHeight;


        viewerCamera.updateProjectionMatrix();


        viewerRenderer.setSize(

            window.innerWidth,
            window.innerHeight

        );

    }

);

</script>

</body>

</html>
